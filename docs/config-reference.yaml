# ============================================================================
# OpenDB 配置文件参考 (~/.opendb/config.yaml)
# ============================================================================
# 未设置的参数使用默认值。只需覆盖需要修改的参数。

# ----------------------------------------------------------------------------
# 连接管理
# ----------------------------------------------------------------------------
connections_dir: ~/.opendb/connections  # 连接配置目录

# ----------------------------------------------------------------------------
# 安全 (Security)
# ----------------------------------------------------------------------------
security:
  default_level: 0              # 默认安全级别 (0=无限制, 1=只读, 2=危险需确认)
  confirm_on_dangerous: true    # DDL/DML 等危险操作前弹出确认

# ----------------------------------------------------------------------------
# 输出 (Output)
# ----------------------------------------------------------------------------
output:
  format: terminal              # 输出格式: terminal | json | csv
  max_rows: 1000                # 查询最大返回行数

# ----------------------------------------------------------------------------
# 会话 (Session)
# ----------------------------------------------------------------------------
session:
  restore_on_switch: true       # 切换连接时恢复会话变量
  history_dir: ~/.opendb/history  # 命令历史存储目录

# ----------------------------------------------------------------------------
# AI / LLM — AI 诊断引擎
# ----------------------------------------------------------------------------
llm:
  provider: none                # LLM 提供商: ollama | none
  model: "qwen3.5:9b"          # 模型名称
  base_url: "http://localhost:11434"  # Ollama API 地址
  diagnose_mode: playbook       # 诊断模式: playbook(单次) | assist(3轮) | auto(10轮)
  max_rounds: 3                 # assist/auto 模式最大轮次
  max_result_tokens: 4000       # 工具返回结果最大 token 数

# ----------------------------------------------------------------------------
# 哨兵 (Sentinel) — 后台实时异常检测
# ----------------------------------------------------------------------------
sentinel:
  # ── 基本行为 ──
  auto_start: true              # 登录后自动启动哨兵 (默认 true)
  probe_interval: 1s            # 轻探针间隔 (每秒只跑2条SQL，开销极小)
  baseline_window: 60           # 基线滑动窗口大小 (样本数)
  min_samples: 10               # 至少采集 N 个样本后才开始检测

  # ── 触发模式 ──
  # adaptive: 自适应 3σ — 根据基线均值+标准差自动计算阈值
  #           稳定的库更敏感，波动大的库更宽容
  # fixed:    固定阈值 — 使用下方 thresholds 的倍数/绝对值
  trigger_mode: adaptive        # adaptive | fixed
  sigma: 3.0                    # adaptive 模式: σ 倍数 (3σ ≈ 99.7% 置信区间)

  # ── 固定模式阈值 (trigger_mode: fixed 时生效) ──
  thresholds:
    # 会话类指标 — 基于 v$session 实时统计
    active_multiplier: 2.0      # 活跃会话超过基线 2 倍触发
    cpu_multiplier: 2.0         # ON CPU 会话超过基线 2 倍触发
    io_multiplier: 3.0          # I/O 等待会话超过基线 3 倍触发
    lock_absolute: 5            # 锁等待会话 ≥ 5 个触发 (绝对值)
    long_sql_absolute: 3        # 运行超10秒的SQL ≥ 3 个触发 (绝对值)

    # 吞吐类指标 — 基于 v$sysstat 增量计算
    redo_multiplier: 5.0        # Redo 生成速率超过基线 5 倍触发
    hard_parse_multiplier: 3.0  # 硬解析速率超过基线 3 倍触发

  # ── 突发采集 (Burst) — 异常触发后的高频采集 ──
  burst_interval: 200ms         # burst 帧间隔 (每200ms采集一次完整快照)
  burst_max_duration: 30s       # burst 最长持续时间
  burst_calm_delay: 5s          # 确认恢复的等待时间

  # ── 冷却 ──
  cooldown: 5m                  # 两次触发间最小间隔 (防止告警风暴)
