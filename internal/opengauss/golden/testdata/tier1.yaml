cases:
  - id: OG-GOLDEN-DB-WDR-LIST-001
    source: current_session
    tier: 1
    database: gaussdb
    model_tier: deterministic
    input: 当前有哪几个wdr报告
    mode: batch
    requires_db: true
    requires_llm: false
    tags: [db, router, wdr]
    expected:
      intent: wdr_list
      route_mode: direct_skill
      skill: wdr
      required_tools: [wdr]
      forbidden_tools: [wdranalyze, sql]
      required_strings: ["WDR 快照", "snapshot_id", "生成对比报告"]
      forbidden_strings: ["generate_wdr_report", "function dbe_perf.generate_wdr_report", "WDR_REPORT_BEGIN", "Evidence Builder", "v1_"]
    quality:
      max_latency_ms: 10000
      min_score: 95

  - id: OG-GOLDEN-DB-BLOCKERS-001
    source: manual
    tier: 1
    database: gaussdb
    model_tier: deterministic
    input: 当前有没有阻塞
    mode: batch
    requires_db: true
    requires_llm: false
    tags: [db, router, blockers]
    expected:
      intent: blockers
      route_mode: direct_skill
      skill: blocktree
      required_tools: [blocktree]
      forbidden_tools: [sql]
      required_strings: ["阻塞"]
      forbidden_strings: ["AI 分析", "第1轮", "generate_wdr_report", "WDR_REPORT_BEGIN", "Evidence Builder"]
    quality:
      max_latency_ms: 10000
      min_score: 90

  - id: OG-GOLDEN-DB-WDR-ANALYZE-65-73-001
    source: current_session
    tier: 1
    database: gaussdb
    model_tier: deterministic
    input: 我们分析下65到73的报告存在哪些问题
    mode: batch
    requires_db: true
    requires_llm: false
    tags: [db, router, wdr]
    expected:
      intent: wdr_analyze
      route_mode: evidence_then_llm
      skill: wdranalyze
      args: "65 73"
      required_tools: [wdranalyze]
      forbidden_tools: [wdr, sql]
      required_strings: ["WDR 分析报告", "65 → 73", "报告元信息", "报告文件"]
      forbidden_strings: ["WDR_REPORT_BEGIN", "Evidence Builder", "v1_", "function dbe_perf.generate_wdr_report"]
    quality:
      max_latency_ms: 90000
      min_score: 90
      must_distinguish_current_vs_historical: true


  - id: OG-GOLDEN-DB-SQLTUNE-SQLID-001
    source: current_session
    tier: 1
    database: gaussdb
    model_tier: all
    input: /sqltune 581990336
    mode: batch
    requires_db: true
    requires_llm: true
    tags: [db, sqltune]
    expected:
      intent: sql_tune
      route_mode: evidence_then_llm
      skill: sqltune
      args: "581990336"
      required_tools: [sqltune]
      required_strings: ["SQL_ID=581990336", "SQL Tuning Report", "执行计划", "优化方案"]
      forbidden_strings: ["2000000×", "预期收益", "WITH ...", "原 SQL 不变 ...", "syntax error at end of input", "候选 SQL/DDL 含模板占位符", "<表名>"]
    quality:
      max_latency_ms: 300000
      min_score: 85
      rubric:
        - name: sqltune_flow
          required_all: ["SQL_ID=581990336", "/sqltune", "执行计划"]
          points: 15
        - name: quality_gate
          forbidden_any: ["2000000×", "预期收益", "WITH ...", "原 SQL 不变 ...", "syntax error at end of input", "<表名>"]
          points: 20
        - name: dba_actionability
          required_any: ["执行前检查", "回滚方式", "风险等级"]
          points: 10

  - id: OG-GOLDEN-DB-CURRENT-DIAG-LLM-001
    source: current_session
    tier: 1
    database: gaussdb
    model_tier: all
    input: 当前数据库存在什么问题
    mode: batch
    requires_db: true
    requires_llm: true
    tags: [db, llm, currentdb]
    expected:
      intent: current_diag
      route_mode: llm
      required_strings: ["根因", "当前", "health", "waits", "blocktree"]
      forbidden_strings: ["exceeds the available context size", "超过 600 秒", "WDR_REPORT_BEGIN", "Evidence Builder"]
    quality:
      max_latency_ms: 180000
      min_score: 85
      must_distinguish_current_vs_historical: true
