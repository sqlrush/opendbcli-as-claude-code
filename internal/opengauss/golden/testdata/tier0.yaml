cases:
  - id: OG-GOLDEN-WDR-LIST-001
    source: current_session
    tier: 0
    database: opengauss
    model_tier: deterministic
    input: 当前有哪几个wdr报告
    mode: natural_language
    requires_db: false
    requires_llm: false
    tags: [router, wdr]
    expected:
      intent: wdr_list
      route_mode: direct_skill
      skill: wdr
      required_tools: [wdr]
      forbidden_tools: [wdranalyze, sql]
    quality:
      max_latency_ms: 5000
      min_score: 90

  - id: OG-GOLDEN-WDR-ANALYZE-PAIR-001
    source: current_session
    tier: 0
    database: gaussdb
    model_tier: deterministic
    input: 分析 快照76和77之间生成的wdr报告
    mode: natural_language
    requires_db: false
    requires_llm: false
    tags: [router, wdr]
    expected:
      intent: wdr_analyze
      route_mode: evidence_then_llm
      skill: wdranalyze
      args: "76 77"
      required_tools: [wdranalyze]
      forbidden_tools: [wdr, sql]
    quality:
      max_latency_ms: 5000
      min_score: 90

